services:
  - type: web
    name: mahiframe
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run check
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://husydmiujigyonlxbuuj.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_zzAitNIGOutgaS5EGZKfrQ_osRrlu8U
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: "100"
